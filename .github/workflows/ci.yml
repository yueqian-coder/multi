name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall claimscope app.py
      - run: python -m claimscope.cli benchmark --engine heuristic --data benchmarks/claimbench.jsonl
      - name: Scan for key-like secrets
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=.git --exclude-dir=.venv --exclude='*.pyc' 'sk-[A-Za-z0-9_-]{20,}|(api[_-]?key|secret|token)[[:space:]]*[:=][[:space:]]*["'"']?[A-Za-z0-9_/-]{20,}' .
