[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimscope"
version = "0.2.0"
description = "Pre-ideation claim, assumption, and negative-evidence mapping."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["streamlit>=1.36"]
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=7.4"]

[project.scripts]
claimscope = "claimscope.cli:main"
claimscope-mcp = "claimscope.mcp_server:main"

[tool.setuptools.packages.find]
include = ["claimscope*"]
