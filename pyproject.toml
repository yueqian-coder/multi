[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claimscope"
version = "0.2.0"
description = "Pre-ideation claim, assumption, and negative-evidence mapping."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["research", "literature-review", "multi-agent", "mcp", "scientific-workflows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
web = ["streamlit>=1.36"]
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=7.4"]
benchmark = ["duckdb>=1.4", "scikit-learn>=1.4"]
semantic = ["sentence-transformers>=3.0"]

[project.scripts]
claimscope = "claimscope.cli:main"
claimscope-mcp = "claimscope.mcp_server:main"

[project.urls]
Homepage = "https://github.com/yueqian-coder/multi"
Repository = "https://github.com/yueqian-coder/multi"
Issues = "https://github.com/yueqian-coder/multi/issues"

[tool.setuptools.packages.find]
include = ["claimscope*"]

[tool.setuptools.package-data]
claimscope = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
